[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physical-shazam"
version = "0.1.0"
description = "Few-shot environmental sound detection with a local listening loop"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "numpy>=1.26,<3",
  "scipy>=1.13,<2", "soundfile>=0.13,<1", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "python-dotenv>=1,<2", "websockets>=14,<18",
  "tensorflow==2.20.0", "tensorflow-hub==0.16.1", "tf-keras==2.20.1",
  "setuptools<81", # tensorflow-hub 0.16 imports pkg_resources, removed in newer setuptools.
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
mic = ["sounddevice>=0.5,<1"]

[project.scripts]
physical-shazam = "physical_shazam.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
